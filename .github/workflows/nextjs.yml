# Continuous integration workflow for validating the Next.js application.
name: Next.js CI

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Runs on pull requests targeting the default branch
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "has-lockfile=true" >> "$GITHUB_OUTPUT"
            echo "install-command=install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "build-command=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "${{ github.workspace }}/package-lock.json" ] || [ -f "${{ github.workspace }}/npm-shrinkwrap.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "has-lockfile=true" >> "$GITHUB_OUTPUT"
            echo "install-command=ci" >> "$GITHUB_OUTPUT"
            echo "build-command=run build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "has-lockfile=false" >> "$GITHUB_OUTPUT"
            echo "install-command=install" >> "$GITHUB_OUTPUT"
            echo "build-command=run build" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unable to determine package manager"
          exit 1

      - name: Setup Node (with dependency cache)
        if: steps.detect-package-manager.outputs.has-lockfile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Node (without dependency cache)
        if: steps.detect-package-manager.outputs.has-lockfile != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.install-command }}

      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.build-command }}
